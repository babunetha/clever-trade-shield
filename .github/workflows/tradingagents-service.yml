name: TradingAgents service

on:
  push:
    paths:
      - "services/tradingagents-service/**"
  pull_request:
    paths:
      - "services/tradingagents-service/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install service dependencies
        working-directory: services/tradingagents-service
        run: pip install -r requirements.txt
      - name: Import service
        working-directory: services/tradingagents-service
        env:
          TRADINGAGENTS_SERVICE_TOKEN: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
        run: python -c "import app; print(app.app.title)"
      - name: Build container
        run: docker build -t clever-trade-shield-tradingagents services/tradingagents-service
