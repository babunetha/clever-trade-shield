name: TradingAgents service CI

on:
  push:
    branches: ["main"]
    paths:
      - "tradingagents-service/**"
      - "render.yaml"
      - ".github/workflows/tradingagents-service.yml"
  pull_request:
    paths:
      - "tradingagents-service/**"
      - "render.yaml"
      - ".github/workflows/tradingagents-service.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q tradingagents-service

      - name: Validate Docker build
        run: docker build -f tradingagents-service/Dockerfile -t clever-trade-shield-tradingagents:test .

      - name: Smoke test application import
        run: docker run --rm -e TRADINGAGENTS_SERVICE_TOKEN=ci-smoke-token clever-trade-shield-tradingagents:test python -c "import app; print('app import ok')"

      - name: Smoke test service health
        shell: bash
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 8020:8020 -e TRADINGAGENTS_SERVICE_TOKEN=ci-smoke-token clever-trade-shield-tradingagents:test)
          cleanup() { docker stop "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8020/health" >/dev/null 2>&1; then
              exit 0
            fi
            if ! docker ps --format '{{.ID}}' | grep -q "^$cid$"; then
              docker logs "$cid" || true
              exit 1
            fi
            sleep 2
          done

          docker logs "$cid" || true
          exit 1
