name: TradingAgents service CI

on:
  push:
    branches: ["main"]
    paths:
      - "tradingagents-service/**"
      - "render.yaml"
      - ".github/workflows/tradingagents-service.yml"
  pull_request:
    paths:
      - "tradingagents-service/**"
      - "render.yaml"
      - ".github/workflows/tradingagents-service.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Validate Python syntax
        run: python -m compileall -q tradingagents-service
      - name: Validate Docker build
        run: docker build -f tradingagents-service/Dockerfile -t clever-trade-shield-tradingagents:test .
      - name: Smoke test application import
        run: docker run --rm -e TRADINGAGENTS_SERVICE_TOKEN=ci-smoke-token clever-trade-shield-tradingagents:test python -c "import app; print('app import ok')"
      - name: Smoke test service health
        run: docker run --rm -e TRADINGAGENTS_SERVICE_TOKEN=ci-smoke-token clever-trade-shield-tradingagents:test python -c "from fastapi.testclient import TestClient; import app; r=TestClient(app.app).get('/health'); assert r.status_code == 200; body=r.json(); assert body['ok'] is True; assert body['execution']['allowed'] is False; print(body)"
