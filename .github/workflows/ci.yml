name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate route tree
        run: bun run generate:routes
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Formatting check
        run: bunx prettier --check . --ignore-path .gitignore
      - name: Lint
        run: bun run lint
      - name: Test suite
        run: bun test
      - name: Security checks
        run: bun run security:check
      - name: Dependency audit
        run: bun audit --audit-level=high
      - name: Production dependency audit
        run: bun audit --prod --audit-level=high
      - name: Production build
        run: bun run build
