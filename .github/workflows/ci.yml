name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write .
      - run: bun audit --audit-level=high
      - run: bun test
      - run: bun run security:check
      - run: bun run lint
      - run: bun run build

  # This repository is a personal private repository. GitHub's hosted
  # dependency-review service is not available here even when repository
  # security settings are enabled. bun audit remains the enforced CI gate.
