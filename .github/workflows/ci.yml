name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cts_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CTS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cts_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Generate route tree
        run: bun run generate:routes
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Formatting check
        run: bunx prettier --check . --ignore-path .gitignore --ignore-path .prettierignore
      - name: Lint
        run: bun run lint
      - name: Test suite
        run: bun test
      - name: Security checks
        run: bun run security:check
      - name: Dependency audit
        run: bun audit --audit-level=high
      - name: Production dependency audit
        run: bun audit --prod --audit-level=high
      - name: Production build
        run: bun run build

  format-cts:
    if: github.event_name == 'pull_request' && github.head_ref == 'cts/completion-followups-2026-11-23' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format changed files
        run: >-
          bunx prettier --write
          src/components/trading/AppShell.tsx
          src/components/trading/DhanConnection.tsx
          src/components/trading/SignalCard.tsx
          src/lib/live-signals.functions.ts
          src/lib/market-data-engine.ts
          src/lib/scanner.functions.ts
          src/lib/scanner/live-candidates.server.ts
          src/lib/trading/store.tsx
          src/routes/_authenticated/index.tsx
          src/routes/_authenticated/market.tsx
          src/routes/_authenticated/scanner.tsx
          --ignore-path .gitignore
          --ignore-path .prettierignore
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Format CTS follow-up changes"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
