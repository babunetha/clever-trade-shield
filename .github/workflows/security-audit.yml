name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==1.178.0"
      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --error \
            --sarif \
            --output semgrep.sarif
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce Semgrep gate
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "Semgrep reported one or more ERROR-severity findings."
          exit 1

  zizmor:
    name: Zizmor GitHub Actions audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Zizmor
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: medium
          min-confidence: medium
      - name: Enforce Zizmor gate
        if: steps.zizmor.outcome == 'failure'
        run: |
          echo "Zizmor reported a medium-or-higher severity GitHub Actions finding."
          exit 1

  trivy:
    name: Trivy filesystem and config audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Enforce Trivy gate
        if: steps.trivy.outcome == 'failure'
        run: |
          echo "Trivy reported one or more HIGH/CRITICAL vulnerabilities or misconfigurations."
          exit 1

  scorecard:
    name: OpenSSF Scorecard audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4.2.2
        with:
          persist-credentials: false
      - name: Run Scorecard
        id: scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: Upload Scorecard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce Scorecard gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.scorecard.outcome }}" != "success" ]; then
            echo "Scorecard execution failed."
            exit 1
          fi
          if [ ! -s scorecard.sarif ]; then
            echo "Scorecard did not produce a SARIF report."
            exit 1
          fi
          findings="$(jq '[.runs[].results[]? | select(.level == "error" or .level == "warning")] | length' scorecard.sarif)"
          echo "Blocking Scorecard findings: $findings"
          if [ "$findings" -gt 0 ]; then
            echo "Scorecard reported warning/error findings."
            exit 1
          fi

  security-summary:
    name: Security gate summary
    needs: [semgrep, zizmor, trivy, scorecard]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Final security gate
        run: |
          echo "Semgrep: ${{ needs.semgrep.result }}"
          echo "Zizmor:  ${{ needs.zizmor.result }}"
          echo "Trivy:   ${{ needs.trivy.result }}"
          echo "Scorecard: ${{ needs.scorecard.result }}"
          for result in "${{ needs.semgrep.result }}" "${{ needs.zizmor.result }}" "${{ needs.trivy.result }}" "${{ needs.scorecard.result }}"; do
            if [ "$result" != "success" ]; then
              echo "Security gate FAILED."
              exit 1
            fi
          done
          echo "Security gate PASSED. Informational findings do not fail this workflow."
